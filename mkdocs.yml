site_name: Docs as Code

theme:
  name: readthedocs

plugins:
  - search

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - js/mermaid.js
nav:
  - Главная: index.md
  - Проект:
      - Описание: project/overview.md
      - Требования: project/requirements.md
      - Диаграммы: project/diagrams.md
